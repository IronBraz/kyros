version: 2

# Weekly, grouped, and capped at 5 open PRs. The point is to notice a security advisory
# within days instead of never; it is not to keep every minor version current on a project
# that ships from one branch.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps arrive as one PR, so the noise stays proportional to the risk.
      # Majors come separately because they are the ones that actually need reading.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
